name: BluffCityCup
options:
  bundleIdPrefix: com.jumpstop
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  BluffCityCup:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - BluffCityCup
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jumpstop.bluffcitycup
        INFOPLIST_FILE: BluffCityCup/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 4Y9BVM7DRL
        SWIFT_VERSION: "5.9"
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: BluffCityCup/Info.plist
      properties:
        CFBundleName: Bluff City Cup
        CFBundleDisplayName: Bluff City Cup
        CFBundleShortVersionString: "2.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        NSLocationWhenInUseUsageDescription: "Used to show your distance to each hole."
        NSLocationAlwaysUsageDescription: "Used to show your distance to each hole."

  BluffCityCupTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - BluffCityCupTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jumpstop.bluffcitycup.tests
        SWIFT_VERSION: "5.9"
    dependencies:
      - target: BluffCityCup
